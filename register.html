<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Recipe App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        body {
            background-color: #3a2a1d;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .auth-container {
            background-color: #212121;
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-in-out;
        }

        .auth-container h2 {
            color: #FAB12F;
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: clamp(1.5rem, 5vw, 2rem);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #b5b5ba;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
        }

        .form-group input {
            width: 100%;
            padding: 0.6rem;
            border-radius: 10px;
            border: none;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            background-color: #333;
            color: #fff;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            transform: scale(1.02);
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.5);
        }

        .auth-btn {
            width: 100%;
            padding: 0.6rem;
            border: none;
            border-radius: 4px;
            background-color: #FAB12F;
            color: #fff;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .auth-btn:hover {
            background-color: #d32f2f;
            transform: translateY(-2px);
        }

        .skip-btn {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #b5b5ba;
            text-decoration: none;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            transition: color 0.3s ease;
        }

        .skip-btn:hover {
            color: #FAB12F;
        }

        .switch-auth {
            text-align: center;
            margin-top: 1rem;
            color: #b5b5ba;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
        }

        .switch-auth a {
            color: #FAB12F;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .switch-auth a:hover {
            color: #d32f2f;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @media (max-width: 576px) {
            .auth-container {
                padding: 1.5rem;
            }

            .auth-container h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <h2>Register for Recipe App</h2>
        <form id="registerForm" action="index.html">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password"
                    minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required
                    placeholder="Confirm your password" minlength="6">
            </div>
            <button type="submit" class="auth-btn">Register</button>
        </form>
        <a href="index.html" class="skip-btn">Skip for now</a>
        <p class="switch-auth">Already have an account? <a href="login.html">Login here</a></p>
    </div>


    <!-- Firebase SDK  -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJ20MqXMnMfFDGYTmKMKnOPy-fU_D0TaQ",
            authDomain: "byjus-b5204.firebaseapp.com",
            projectId: "byjus-b5204",
            storageBucket: "byjus-b5204.firebasestorage.app",
            messagingSenderId: "153492544506",
            appId: "1:153492544506:web:da38afc27c4f4ace6f2243"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                alert("Passwords don't match!");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                alert("Registration successful! 🎉");
                window.location.href = "index.html"; // Redirect after signup
            } catch (error) {
                console.error("Error:", error);

                // Better error messages
                if (error.code === "auth/email-already-in-use") {
                    alert("This email is already registered. Try logging in instead.");
                }
                else if (error.code === "auth/operation-not-allowed") {
                    alert("Email/password sign-in is disabled. Contact support.");
                }
                else {
                    alert(`Error: ${error.message}`);
                }
            }
        });
    </script>
</body>

</html>
