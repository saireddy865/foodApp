<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>


    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }
    html {
        scroll-behavior: smooth;
    }
    body {
        background-color: #3a2a1d; /* Darker background */
        color: #fff;
    }
    /* Header  part */
    header nav {
        background-color: #212121; /* Header color */
        padding: 20px;
        top: 0px;
        left: 0px;
        width: 100%;
        position: fixed;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
    }
    header nav h1 {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #f44336; /* Title color */
    }
        .carousel-item img {
            width: 100%;
            height: 400px; /* Set a fixed height */
            object-fit: cover; /* Ensures images fit without distortion */
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1>Recipe App</h1>
             <!-- <a href="fav.html" class="fav-button">Favorites</a>  -->
            
            
             <form>
                <section>
                     <!-- <!- <h1>Favorites</h1>   -->
                    <div class="favorites-container">
                        <!-- <!- <p>No favorite recipes added yet.</p>   -->
                    </div>
                </section>
                <input type="text" placeholder="Search for recipes..." class="searchBox" style="width: 500px; border-radius: 10px; text-align: center; "> <!--<i class="fa-solid fa-magnifying-glass"></i> -->
                <button type="submit" class="searchBtn">Search</button>
            </form> 

            <a href="">Home</a>
            <a href="fav.html" class="fav-button">Favorites</a>
            <a href=""> Products</a>
            <a href="">Trending Recipes</a> 
            <a href="">About Us</a>
            <div style="display: flex; align-items: center;gap: 25px; margin-left: 20px;">
                <button style="background-color: #f44336; color: white;border: none; padding: 10px 20px; border-radius: 8px;cursor: pointer; transition: background-color 0.3s ease-in-out;font-size: 18px;">Login</button>
                <button style="background-color: #f44336; color: white;border: none; padding: 10px 20px; border-radius: 8px;cursor: pointer; transition: background-color 0.3s ease-in-out;font-size: 18px;">Sigin</button>
                <i class="fa-solid fa-user" style="font-size: 24px; color: white; cursor: pointer;"></i>
               
                <label for="check" style="display: none;" id="check"> 
                <i class="fa-solid fa-bars"></i>

                </label>
                <input type="checkbox" id="check" name="check"  style="display: none;">
                
            </div>

        </nav>

    </header>
    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1X_Zudgku0DE4hHvBxqNsIkhFlEQURMLRjA&s" class="d-block w-100" alt="Image 1">
          </div>
          <div class="carousel-item">
            <img src="https://cdn.create.vista.com/downloads/d4043aec-a345-41c7-816c-dfaa3d8d13d1_1024.jpeg" class="d-block w-100" alt="Image 2">
          </div>
          <div class="carousel-item">
            <img src="https://images.everyplate.com/w_3840,q_auto,f_auto,c_limit,fl_lossy/hellofresh_website/us/landing-pages/SEO-content-images/1420286175_EP_DiscountReductionTest-PDSAds_2024-07.jpg" class="d-block w-100" alt="Image 3">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
